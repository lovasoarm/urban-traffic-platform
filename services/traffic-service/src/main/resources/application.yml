server:
  port: 8081
  shutdown: graceful
spring:
  application:
    name: traffic-service
  lifecycle:
    timeout-per-shutdown-phase: 20s
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://mongodb:27017/urban_traffic}
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s
management:
  server:
    port: 9081
  endpoints:
    web:
      exposure:
        include: health,prometheus,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  metrics:
    tags:
      application: ${spring.application.name}
traffic:
  ingestion:
    max-batch-size: ${TRAFFIC_MAX_BATCH_SIZE:500}
    smoothing-factor: ${TRAFFIC_SMOOTHING_FACTOR:0.35}
  cache:
    ttl: ${REDIS_TTL:10m}
  congestion:
    free-ratio: ${CONGESTION_FREE_RATIO:0.70}
    dense-ratio: ${CONGESTION_DENSE_RATIO:0.40}
    congested-ratio: ${CONGESTION_CONGESTED_RATIO:0.15}
  retention:
    days: ${MONGO_RETENTION_DAYS:7}
  freshness:
    max-age: ${TRAFFIC_MAX_READING_AGE:10m}
    max-future-skew: ${TRAFFIC_MAX_FUTURE_SKEW:1m}
